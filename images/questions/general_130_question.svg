<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Vier Stimmzettel zur Auswahl">
  <title>Welcher Stimmzettel wäre bei einer Bundestagswahl gültig?</title>
  <rect width="800" height="340" fill="#fff"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#111" text-anchor="middle">
    <text x="100" y="30">1</text><text x="300" y="30">2</text><text x="500" y="30">3</text><text x="700" y="30">4</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif">
    <!-- paper 1: valid -->
    <g transform="translate(40 48)">
      <rect width="140" height="250" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
      <text x="70" y="26" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Stimmzettel</text>
      <line x1="12" y1="34" x2="128" y2="34" stroke="#c9c9c9" stroke-width="1.5"/>
      <g stroke="#333" stroke-width="1.6">
        <line x1="14" y1="66" x2="96" y2="66"/><circle cx="116" cy="66" r="11" fill="#fff"/>
        <line x1="14" y1="106" x2="96" y2="106"/><circle cx="116" cy="106" r="11" fill="#fff"/>
        <line x1="14" y1="146" x2="96" y2="146"/><circle cx="116" cy="146" r="11" fill="#fff"/>
        <line x1="14" y1="186" x2="96" y2="186"/><circle cx="116" cy="186" r="11" fill="#fff"/>
        <line x1="14" y1="226" x2="96" y2="226"/><circle cx="116" cy="226" r="11" fill="#fff"/>
      </g>
      <g stroke="#1a4fb4" stroke-width="4" stroke-linecap="round">
        <line x1="109" y1="99" x2="123" y2="113"/><line x1="123" y1="99" x2="109" y2="113"/>
      </g>
    </g>

    <!-- paper 2: two crosses -->
    <g transform="translate(240 48)">
      <rect width="140" height="250" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
      <text x="70" y="26" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Stimmzettel</text>
      <line x1="12" y1="34" x2="128" y2="34" stroke="#c9c9c9" stroke-width="1.5"/>
      <g stroke="#333" stroke-width="1.6">
        <line x1="14" y1="66" x2="96" y2="66"/><circle cx="116" cy="66" r="11" fill="#fff"/>
        <line x1="14" y1="106" x2="96" y2="106"/><circle cx="116" cy="106" r="11" fill="#fff"/>
        <line x1="14" y1="146" x2="96" y2="146"/><circle cx="116" cy="146" r="11" fill="#fff"/>
        <line x1="14" y1="186" x2="96" y2="186"/><circle cx="116" cy="186" r="11" fill="#fff"/>
        <line x1="14" y1="226" x2="96" y2="226"/><circle cx="116" cy="226" r="11" fill="#fff"/>
      </g>
      <g stroke="#1a4fb4" stroke-width="4" stroke-linecap="round">
        <line x1="109" y1="59" x2="123" y2="73"/><line x1="123" y1="59" x2="109" y2="73"/>
        <line x1="109" y1="179" x2="123" y2="193"/><line x1="123" y1="179" x2="109" y2="193"/>
      </g>
    </g>

    <!-- paper 3: cross outside the box -->
    <g transform="translate(440 48)">
      <rect width="140" height="250" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
      <text x="70" y="26" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Stimmzettel</text>
      <line x1="12" y1="34" x2="128" y2="34" stroke="#c9c9c9" stroke-width="1.5"/>
      <g stroke="#333" stroke-width="1.6">
        <line x1="14" y1="66" x2="96" y2="66"/><circle cx="116" cy="66" r="11" fill="#fff"/>
        <line x1="14" y1="106" x2="96" y2="106"/><circle cx="116" cy="106" r="11" fill="#fff"/>
        <line x1="14" y1="146" x2="96" y2="146"/><circle cx="116" cy="146" r="11" fill="#fff"/>
        <line x1="14" y1="186" x2="96" y2="186"/><circle cx="116" cy="186" r="11" fill="#fff"/>
        <line x1="14" y1="226" x2="96" y2="226"/><circle cx="116" cy="226" r="11" fill="#fff"/>
      </g>
      <g stroke="#1a4fb4" stroke-width="4" stroke-linecap="round">
        <line x1="30" y1="92" x2="44" y2="106"/><line x1="44" y1="92" x2="30" y2="106"/>
      </g>
      <text x="70" y="126" font-size="9" fill="#1a4fb4" text-anchor="middle">ja, diese Partei</text>
    </g>

    <!-- paper 4: scribbled over -->
    <g transform="translate(640 48)">
      <rect width="140" height="250" fill="#fff" stroke="#8a8a8a" stroke-width="2"/>
      <text x="70" y="26" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Stimmzettel</text>
      <line x1="12" y1="34" x2="128" y2="34" stroke="#c9c9c9" stroke-width="1.5"/>
      <g stroke="#333" stroke-width="1.6">
        <line x1="14" y1="66" x2="96" y2="66"/><circle cx="116" cy="66" r="11" fill="#fff"/>
        <line x1="14" y1="106" x2="96" y2="106"/><circle cx="116" cy="106" r="11" fill="#fff"/>
        <line x1="14" y1="146" x2="96" y2="146"/><circle cx="116" cy="146" r="11" fill="#fff"/>
        <line x1="14" y1="186" x2="96" y2="186"/><circle cx="116" cy="186" r="11" fill="#fff"/>
        <line x1="14" y1="226" x2="96" y2="226"/><circle cx="116" cy="226" r="11" fill="#fff"/>
      </g>
      <g stroke="#1a4fb4" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M106,140 C118,132 128,150 112,158 C100,164 104,146 120,150"/>
        <line x1="104" y1="136" x2="128" y2="160"/>
      </g>
      <text x="70" y="205" font-size="9" fill="#1a4fb4" text-anchor="middle">ungültig?</text>
    </g>
  </g>
</svg>
